server {
    listen 80;

    # הדף הראשי - לוח הבקרה
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse Proxy: כל בקשה ל-/storage/... עוברת לשרת Apache.
    # "storage" הוא שם השירות ב-docker-compose.yml - Docker מתרגם אותו לכתובת IP פנימית.
    # בקשה ל-/storage/NOVA-07.png  ->  http://storage/plates/NOVA-07.png
    location /storage/ {
        proxy_pass http://storage/plates/;
    }
}
